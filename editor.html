<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editor de Playlists • PLAY 12</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #0d0d1a; color: #e0e0e0; padding: 20px; min-height: 100vh; }
        .container { max-width: 1300px; margin: 0 auto; }
        h1 { color: #00f3ff; text-shadow: 0 0 20px rgba(0,243,255,0.3); margin-bottom: 10px; font-size: 2rem; display: flex; align-items: center; gap: 10px; }
        .subtitle { color: #888; margin-bottom: 20px; font-size: 0.9rem; }
        
        .controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; background: rgba(255,255,255,0.05); padding: 12px 16px; border-radius: 12px; margin-bottom: 15px; border: 1px solid rgba(255,255,255,0.08); }
        .controls label { font-weight: 600; color: #aaa; margin-right: 5px; }
        .controls select, .controls input[type="text"] { background: #1a1a2e; color: #fff; border: 1px solid #333; padding: 8px 12px; border-radius: 8px; outline: none; }
        .controls select:focus, .controls input:focus { border-color: #00f3ff; }
        .controls button { background: linear-gradient(135deg, #00f3ff, #0088cc); border: none; color: #000; font-weight: bold; padding: 8px 18px; border-radius: 30px; cursor: pointer; transition: 0.2s; }
        .controls button:hover { transform: scale(1.05); opacity: 0.9; }
        .controls button.danger { background: linear-gradient(135deg, #ff2d7f, #cc0055); color: #fff; }
        .controls button.success { background: linear-gradient(135deg, #4ade80, #22c55e); color: #000; }
        .controls button.warning { background: linear-gradient(135deg, #f59e0b, #d97706); color: #000; }
        .controls button.purple { background: linear-gradient(135deg, #a855f7, #7c3aed); color: #fff; }
        .controls button.play { background: linear-gradient(135deg, #00f3ff, #ff2d7f); color: #000; }

        .search-bar { display: flex; gap: 8px; align-items: center; background: rgba(255,255,255,0.03); padding: 6px 12px; border-radius: 30px; border: 1px solid rgba(255,255,255,0.1); flex: 1; min-width: 180px; }
        .search-bar i { color: #666; }
        .search-bar input { background: transparent; border: none; color: #fff; padding: 6px 8px; outline: none; width: 100%; font-size: 0.9rem; }
        .search-bar input::placeholder { color: #555; }
        
        .table-wrapper { overflow-x: auto; background: rgba(255,255,255,0.03); border-radius: 12px; border: 1px solid rgba(255,255,255,0.06); padding: 10px; }
        table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
        th { background: rgba(0,243,255,0.1); color: #00f3ff; padding: 10px 8px; text-align: left; font-weight: 600; border-bottom: 2px solid #00f3ff; position: sticky; top: 0; z-index: 2; }
        td { padding: 8px; border-bottom: 1px solid rgba(255,255,255,0.05); vertical-align: middle; }
        tr:hover td { background: rgba(255,255,255,0.03); }
        
        th:nth-child(1), td:nth-child(1) { width: 50px; min-width: 50px; }
        th:nth-child(2), td:nth-child(2) { width: 20%; min-width: 120px; }
        th:nth-child(3), td:nth-child(3) { width: 18%; min-width: 100px; }
        th:nth-child(4), td:nth-child(4) { width: 12%; min-width: 80px; }
        th:nth-child(5), td:nth-child(5) { width: 35%; min-width: 200px; }
        th:nth-child(6), td:nth-child(6) { width: 110px; min-width: 110px; }

        .editable-input { background: transparent; border: none; color: #fff; width: 100%; padding: 4px; border-radius: 4px; transition: 0.15s; font-size: 0.8rem; }
        .editable-input:hover { background: rgba(255,255,255,0.05); }
        .editable-input:focus { background: #1a1a2e; outline: 1px solid #00f3ff; }
        .editable-input.id { color: #666; width: 50px; }
        .editable-input.src { font-size: 0.7rem; font-family: monospace; }
        
        .actions { display: flex; gap: 4px; flex-wrap: wrap; }
        .actions button { background: transparent; border: none; color: #888; cursor: pointer; padding: 4px 6px; border-radius: 4px; transition: 0.15s; font-size: 0.9rem; }
        .actions button:hover { background: rgba(255,255,255,0.1); color: #fff; }
        .actions button.del:hover { color: #ff2d7f; background: rgba(255,45,127,0.15); }
        .actions button.move:hover { color: #00f3ff; }
        
        .add-row { background: rgba(255,255,255,0.03); border: 1px dashed rgba(255,255,255,0.15); padding: 8px; text-align: center; cursor: pointer; border-radius: 8px; margin-top: 8px; transition: 0.2s; }
        .add-row:hover { background: rgba(0,243,255,0.05); border-color: #00f3ff; }
        
        .status { margin-top: 15px; padding: 10px 14px; background: rgba(255,255,255,0.05); border-radius: 8px; border-left: 4px solid #00f3ff; font-size: 0.9rem; }
        .status.error { border-left-color: #ff2d7f; color: #ff6b8a; }
        .status.success { border-left-color: #4ade80; color: #7ae0a0; }
        .status.warning { border-left-color: #f59e0b; color: #fbbf24; }
        
        .export-area { margin-top: 20px; display: flex; flex-direction: column; gap: 10px; }
        .export-area textarea { width: 100%; height: 120px; background: #0a0a14; color: #c0c0c0; border: 1px solid #333; border-radius: 8px; padding: 10px; font-family: monospace; font-size: 0.75rem; resize: vertical; }
        .btn-group { display: flex; gap: 8px; flex-wrap: wrap; }
        .btn-group button { padding: 6px 14px; border-radius: 30px; border: none; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .btn-group button:hover { transform: scale(1.04); }
        .btn-group button.primary { background: #00f3ff; color: #000; }
        .btn-group button.secondary { background: #333; color: #fff; }
        .btn-group button.danger { background: #ff2d7f; color: #fff; }
        
        @media (max-width: 600px) {
            .controls { flex-direction: column; align-items: stretch; }
            .controls label { margin-top: 5px; }
            th, td { font-size: 0.7rem; padding: 4px; }
            .editable-input { font-size: 0.7rem; }
            th:nth-child(5), td:nth-child(5) { min-width: 120px; }
        }
        
        .loading { display: none; text-align: center; padding: 30px; color: #00f3ff; }
        .loading.active { display: block; }
        .loading i { font-size: 2rem; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .tr-hidden { display: none; }
        #fileInput { display: none; }
    </style>
</head>
<body>
<div class="container">
    <h1><i class="fas fa-pen"></i> Editor de Playlists</h1>
    <div class="subtitle">Carregue, edite, reordene e exporte suas listas de músicas</div>

    <div class="controls">
        <label for="genreSelect">Gênero:</label>
        <select id="genreSelect"></select>
        <button id="loadBtn" class="success"><i class="fas fa-sync"></i> Carregar</button>
        <button id="addBtn" class="primary"><i class="fas fa-plus"></i> Adicionar</button>
        <button id="addMultipleBtn" class="purple"><i class="fas fa-folder-open"></i> Adicionar Múltiplas</button>
        <button id="sendToPlayerBtn" class="play"><i class="fas fa-play"></i> Enviar para Player</button>
        <button id="saveBtn" class="primary"><i class="fas fa-save"></i> Salvar JSON</button>
        <button id="resetBtn" class="warning"><i class="fas fa-undo"></i> Resetar</button>
        <button id="clearAllBtn" class="danger"><i class="fas fa-trash-alt"></i> Apagar Tudo</button>
        <span style="color:#666; font-size:0.8rem; margin-left:auto;" id="countDisplay">0 músicas</span>
    </div>

    <input type="file" id="fileInput" multiple accept="audio/*,.mp3,.m4a,.wav,.ogg,.flac">

    <div class="search-bar">
        <i class="fas fa-search"></i>
        <input type="text" id="searchInput" placeholder="Buscar música por título, artista ou src..." autocomplete="off">
        <span id="searchCount" style="color:#666; font-size:0.75rem; white-space:nowrap;"></span>
    </div>

    <div class="loading" id="loading"><i class="fas fa-spinner"></i> Carregando...</div>

    <div class="table-wrapper">
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Título</th>
                    <th>Artista</th>
                    <th>Gênero</th>
                    <th>Src (URL)</th>
                    <th style="width:110px;">Ações</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
        <div class="add-row" id="addRowBtn"><i class="fas fa-plus-circle"></i> Adicionar nova música</div>
    </div>

    <div id="status" class="status">✅ Pronto para editar.</div>

    <div class="export-area">
        <textarea id="jsonOutput" placeholder="JSON exportado aparecerá aqui..."></textarea>
        <div class="btn-group">
            <button class="primary" id="copyBtn"><i class="fas fa-copy"></i> Copiar JSON</button>
            <button class="secondary" id="downloadBtn"><i class="fas fa-download"></i> Baixar .json</button>
            <button class="danger" id="minifyBtn"><i class="fas fa-compress-alt"></i> Minificar</button>
        </div>
    </div>
</div>

<script>
    // ============================================================
    // DEFINIÇÃO DOS GÊNEROS E URLs (INCLUINDO REGGAE)
    // ============================================================
    const GENRE_URLS = {
        'MPB': 'https://raw.githubusercontent.com/radiolojasjc-hub/listtop/refs/heads/main/mpb.json',
        'POP': 'https://raw.githubusercontent.com/radiolojasjc-hub/listtop/refs/heads/main/pop.json',
        'SERTANEJO': 'https://raw.githubusercontent.com/radiolojasjc-hub/listtop/refs/heads/main/sertanejo.json',
        'FORRÓ': 'https://raw.githubusercontent.com/radiolojasjc-hub/listtop/refs/heads/main/forro.json',
        'SAMBA': 'https://raw.githubusercontent.com/radiolojasjc-hub/listtop/refs/heads/main/samba.json',
        'GLOBAL HITS': 'https://raw.githubusercontent.com/radiolojasjc-hub/listtop/refs/heads/main/global.json',
        'CRISTÃ': 'https://raw.githubusercontent.com/radiolojasjc-hub/listtop/refs/heads/main/crita.json',
        'BREGA': 'https://raw.githubusercontent.com/radiolojasjc-hub/listtop/refs/heads/main/brega.json',
        'MODA TOP': 'https://raw.githubusercontent.com/radiolojasjc-hub/listtop/refs/heads/main/moda.json',
        'REGGAE': 'https://raw.githubusercontent.com/radiolojasjc-hub/listtop/refs/heads/main/reggae.json'
    };

    let currentGenre = 'MPB';
    let playlistData = [];
    let originalData = [];
    let isDirty = false;

    const genreSelect = document.getElementById('genreSelect');
    const loadBtn = document.getElementById('loadBtn');
    const addBtn = document.getElementById('addBtn');
    const addMultipleBtn = document.getElementById('addMultipleBtn');
    const fileInput = document.getElementById('fileInput');
    const sendToPlayerBtn = document.getElementById('sendToPlayerBtn');
    const saveBtn = document.getElementById('saveBtn');
    const resetBtn = document.getElementById('resetBtn');
    const clearAllBtn = document.getElementById('clearAllBtn');
    const tableBody = document.getElementById('tableBody');
    const addRowBtn = document.getElementById('addRowBtn');
    const statusDiv = document.getElementById('status');
    const loadingDiv = document.getElementById('loading');
    const jsonOutput = document.getElementById('jsonOutput');
    const copyBtn = document.getElementById('copyBtn');
    const downloadBtn = document.getElementById('downloadBtn');
    const minifyBtn = document.getElementById('minifyBtn');
    const countDisplay = document.getElementById('countDisplay');
    const searchInput = document.getElementById('searchInput');
    const searchCount = document.getElementById('searchCount');

    // Popular select
    Object.keys(GENRE_URLS).forEach(g => {
        const opt = document.createElement('option');
        opt.value = g;
        opt.textContent = g;
        genreSelect.appendChild(opt);
    });
    genreSelect.value = 'MPB';

    function setStatus(msg, type = 'success') {
        statusDiv.textContent = msg;
        statusDiv.className = 'status ' + type;
    }

    function updateCount() {
        countDisplay.textContent = playlistData.length + ' músicas';
        const visible = document.querySelectorAll('#tableBody tr:not(.tr-hidden)').length;
        searchCount.textContent = searchInput.value.trim() ? `(${visible} / ${playlistData.length})` : '';
    }

    function showLoading(show) {
        loadingDiv.classList.toggle('active', show);
    }

    function generateId() {
        return Math.floor(Math.random() * 900000) + 100000;
    }

    function formatJsonPerLine(arr) {
        if (!arr || arr.length === 0) return '[]';
        const lines = arr.map(obj => JSON.stringify(obj));
        return '[\n' + lines.join(',\n') + '\n]';
    }

    async function loadPlaylist(genre) {
        const url = GENRE_URLS[genre];
        if (!url) { setStatus('Gênero inválido', 'error'); return; }
        showLoading(true);
        try {
            const resp = await fetch(url);
            if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
            let data = await resp.json();
            if (!Array.isArray(data)) {
                if (data.musicas && Array.isArray(data.musicas)) data = data.musicas;
                else if (data.data && Array.isArray(data.data)) data = data.data;
                else {
                    const vals = Object.values(data);
                    if (vals.length && Array.isArray(vals[0])) data = vals[0];
                    else throw new Error('Formato inválido');
                }
            }
            playlistData = data.filter(m => m.src && m.src.trim() && m.title && m.title.trim());
            playlistData.forEach(m => {
                m.id = m.id || generateId();
                m.genero = genre;
                m.artist = m.artist || 'Desconhecido';
                m.title = m.title || 'Sem título';
                m.src = m.src || '';
            });
            if (genre === 'SERTANEJO') {
                playlistData.sort((a, b) => a.title.localeCompare(b.title, 'pt', { sensitivity: 'base' }));
            }
            originalData = JSON.parse(JSON.stringify(playlistData));
            isDirty = false;
            renderTable();
            setStatus(`✅ ${playlistData.length} músicas carregadas de "${genre}"`, 'success');
            updateCount();
            showLoading(false);
            searchInput.value = '';
            searchCount.textContent = '';
            jsonOutput.value = '';
        } catch (err) {
            setStatus(`❌ Erro ao carregar ${genre}: ${err.message}`, 'error');
            showLoading(false);
            playlistData = [];
            renderTable();
            updateCount();
        }
    }

    function renderTable() {
        tableBody.innerHTML = '';
        const searchTerm = searchInput.value.trim().toLowerCase();
        playlistData.forEach((item, index) => {
            const tr = document.createElement('tr');
            tr.dataset.index = index;

            const tdId = document.createElement('td');
            const idInput = document.createElement('input');
            idInput.type = 'text';
            idInput.className = 'editable-input id';
            idInput.value = item.id || '';
            idInput.dataset.field = 'id';
            tdId.appendChild(idInput);

            const tdTitle = document.createElement('td');
            const titleInput = document.createElement('input');
            titleInput.type = 'text';
            titleInput.className = 'editable-input';
            titleInput.value = item.title || '';
            titleInput.dataset.field = 'title';
            tdTitle.appendChild(titleInput);

            const tdArtist = document.createElement('td');
            const artistInput = document.createElement('input');
            artistInput.type = 'text';
            artistInput.className = 'editable-input';
            artistInput.value = item.artist || '';
            artistInput.dataset.field = 'artist';
            tdArtist.appendChild(artistInput);

            const tdGenre = document.createElement('td');
            const genreInput = document.createElement('input');
            genreInput.type = 'text';
            genreInput.className = 'editable-input';
            genreInput.value = item.genero || '';
            genreInput.dataset.field = 'genero';
            tdGenre.appendChild(genreInput);

            const tdSrc = document.createElement('td');
            const srcInput = document.createElement('input');
            srcInput.type = 'text';
            srcInput.className = 'editable-input src';
            srcInput.value = item.src || '';
            srcInput.dataset.field = 'src';
            tdSrc.appendChild(srcInput);

            const tdActions = document.createElement('td');
            tdActions.className = 'actions';
            const upBtn = document.createElement('button');
            upBtn.innerHTML = '<i class="fas fa-chevron-up"></i>';
            upBtn.className = 'move';
            upBtn.addEventListener('click', () => moveItem(index, -1));

            const downBtn = document.createElement('button');
            downBtn.innerHTML = '<i class="fas fa-chevron-down"></i>';
            downBtn.className = 'move';
            downBtn.addEventListener('click', () => moveItem(index, 1));

            const delBtn = document.createElement('button');
            delBtn.innerHTML = '<i class="fas fa-trash"></i>';
            delBtn.className = 'del';
            delBtn.addEventListener('click', () => removeItem(index));

            tdActions.append(upBtn, downBtn, delBtn);
            tr.append(tdId, tdTitle, tdArtist, tdGenre, tdSrc, tdActions);
            tableBody.appendChild(tr);
        });

        applyFilter(searchInput.value.trim());
        document.querySelectorAll('.editable-input').forEach(inp => {
            inp.addEventListener('input', onInputChange);
        });
        updateCount();
    }

    function applyFilter(term) {
        const rows = tableBody.querySelectorAll('tr');
        const clean = term.toLowerCase().trim();
        let visibleCount = 0;
        rows.forEach((row, idx) => {
            if (idx >= playlistData.length) return;
            const item = playlistData[idx];
            if (!item) return;
            const match = !clean || 
                item.title.toLowerCase().includes(clean) ||
                item.artist.toLowerCase().includes(clean) ||
                item.src.toLowerCase().includes(clean) ||
                String(item.id).includes(clean);
            if (match) {
                row.classList.remove('tr-hidden');
                visibleCount++;
            } else {
                row.classList.add('tr-hidden');
            }
        });
        searchCount.textContent = clean ? `(${visibleCount} / ${playlistData.length})` : '';
    }

    function onInputChange(e) {
        const input = e.target;
        const tr = input.closest('tr');
        if (!tr) return;
        const index = parseInt(tr.dataset.index);
        if (isNaN(index)) return;
        const field = input.dataset.field;
        if (field && playlistData[index]) {
            playlistData[index][field] = input.value;
            isDirty = true;
            setStatus('✏️ Alterações detectadas. Salve para persistir.', 'success');
        }
    }

    function moveItem(index, direction) {
        const newIndex = index + direction;
        if (newIndex < 0 || newIndex >= playlistData.length) return;
        [playlistData[index], playlistData[newIndex]] = [playlistData[newIndex], playlistData[index]];
        isDirty = true;
        renderTable();
        setStatus('↕️ Ordem alterada. Salve para persistir.', 'success');
    }

    function removeItem(index) {
        if (confirm(`Remover "${playlistData[index].title}"?`)) {
            playlistData.splice(index, 1);
            isDirty = true;
            renderTable();
            setStatus('🗑️ Música removida.', 'success');
        }
    }

    function clearAll() {
        if (playlistData.length === 0) {
            setStatus('⚠️ A playlist já está vazia.', 'warning');
            return;
        }
        if (confirm(`⚠️ Tem certeza que deseja APAGAR TODAS as ${playlistData.length} músicas?`)) {
            playlistData = [];
            isDirty = true;
            renderTable();
            setStatus('🗑️ Todas as músicas foram removidas.', 'success');
            jsonOutput.value = '';
        }
    }

    function addNewMusic() {
        const newMusic = {
            id: generateId(),
            artist: 'Novo Artista',
            title: 'Nova Música',
            genero: currentGenre,
            src: 'http://exemplo.com/musica.mp3'
        };
        playlistData.push(newMusic);
        isDirty = true;
        renderTable();
        setStatus('➕ Nova música adicionada. Edite os campos e salve.', 'success');
        const rows = tableBody.querySelectorAll('tr');
        if (rows.length) rows[rows.length - 1].scrollIntoView({ behavior: 'smooth' });
    }

    function addMultipleFiles(files) {
        if (!files || files.length === 0) {
            setStatus('⚠️ Nenhum arquivo selecionado.', 'warning');
            return;
        }
        let added = 0;
        const newSongs = [];
        for (const file of files) {
            const fileName = file.name.replace(/\.[^/.]+$/, '');
            const ext = file.name.split('.').pop().toLowerCase();
            const audioExtensions = ['mp3', 'm4a', 'wav', 'ogg', 'flac', 'aac', 'wma'];
            if (!audioExtensions.includes(ext)) continue;
            const newMusic = {
                id: generateId(),
                artist: 'Desconhecido',
                title: fileName,
                genero: currentGenre,
                src: file.name
            };
            newSongs.push(newMusic);
            added++;
        }
        if (added === 0) {
            setStatus('⚠️ Nenhum arquivo de áudio válido encontrado.', 'warning');
            return;
        }
        playlistData.push(...newSongs);
        isDirty = true;
        renderTable();
        setStatus(`✅ ${added} música(s) adicionadas com sucesso!`, 'success');
        const rows = tableBody.querySelectorAll('tr');
        if (rows.length) rows[rows.length - 1].scrollIntoView({ behavior: 'smooth' });
    }

    // ============================================================
    // ENVIAR PARA O PLAYER (INTEGRAÇÃO)
    // ============================================================
    function sendToPlayer() {
        if (playlistData.length === 0) {
            setStatus('⚠️ Playlist vazia. Adicione músicas primeiro.', 'warning');
            return;
        }
        localStorage.setItem('playlist_editor_play12', JSON.stringify(playlistData));
        setStatus('✅ Playlist enviada para o player! Abrindo...', 'success');
        window.open('https://radiolojasjc-hub.github.io/listtop/', '_blank');
    }

    // ============================================================
    // EXPORTAÇÃO
    // ============================================================
    function getFormattedJson() {
        return formatJsonPerLine(playlistData);
    }

    function saveToJson() {
        const output = getFormattedJson();
        jsonOutput.value = output;
        setStatus('📦 JSON com cada música em uma linha gerado!', 'success');
        isDirty = false;
        return output;
    }

    function downloadJson() {
        const json = jsonOutput.value || getFormattedJson();
        const blob = new Blob([json], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `${currentGenre}_playlist.json`;
        a.click();
        URL.revokeObjectURL(url);
        setStatus(`⬇️ Download de "${currentGenre}_playlist.json" iniciado.`, 'success');
    }

    function copyJson() {
        const json = jsonOutput.value || getFormattedJson();
        navigator.clipboard.writeText(json).then(() => {
            setStatus('📋 JSON copiado para a área de transferência!', 'success');
        }).catch(() => {
            setStatus('❌ Falha ao copiar.', 'error');
        });
    }

    function minifyTextarea() {
        try {
            const raw = jsonOutput.value;
            if (!raw.trim()) { setStatus('⚠️ Textarea vazio.', 'warning'); return; }
            const parsed = JSON.parse(raw);
            jsonOutput.value = formatJsonPerLine(parsed);
            setStatus('🔄 JSON reformatado com cada música em uma linha.', 'success');
        } catch (e) {
            setStatus('❌ Erro ao processar: JSON inválido.', 'error');
        }
    }

    function resetPlaylist() {
        if (!originalData.length) {
            setStatus('⚠️ Nenhum backup disponível. Recarregue a playlist.', 'error');
            return;
        }
        if (isDirty && !confirm('Você tem alterações não salvas. Deseja realmente descartá-las?')) return;
        playlistData = JSON.parse(JSON.stringify(originalData));
        isDirty = false;
        renderTable();
        setStatus('🔄 Playlist restaurada para a versão original.', 'success');
        jsonOutput.value = '';
        searchInput.value = '';
        searchCount.textContent = '';
    }

    // ============================================================
    // EVENTOS
    // ============================================================
    genreSelect.addEventListener('change', () => {
        currentGenre = genreSelect.value;
        loadPlaylist(currentGenre);
    });

    loadBtn.addEventListener('click', () => {
        loadPlaylist(currentGenre);
    });

    addBtn.addEventListener('click', addNewMusic);
    addRowBtn.addEventListener('click', addNewMusic);

    addMultipleBtn.addEventListener('click', () => {
        fileInput.click();
    });
    fileInput.addEventListener('change', (e) => {
        if (e.target.files && e.target.files.length > 0) {
            addMultipleFiles(e.target.files);
        }
        fileInput.value = '';
    });

    sendToPlayerBtn.addEventListener('click', sendToPlayer);

    saveBtn.addEventListener('click', saveToJson);
    downloadBtn.addEventListener('click', downloadJson);
    copyBtn.addEventListener('click', copyJson);
    minifyBtn.addEventListener('click', minifyTextarea);

    resetBtn.addEventListener('click', resetPlaylist);
    clearAllBtn.addEventListener('click', clearAll);

    searchInput.addEventListener('input', (e) => {
        const term = e.target.value;
        applyFilter(term);
        updateCount();
    });

    window.addEventListener('load', () => {
        loadPlaylist('MPB');
    });
</script>
</body>
</html>
